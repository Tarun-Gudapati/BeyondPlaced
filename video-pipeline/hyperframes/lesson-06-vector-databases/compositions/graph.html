    const a = T.l04.w, b = T.l05.w, c = T.l06.w;

    blurIn("#g-k1", 0.2, 0.2);
    blurIn("#g-big", a[6], 0.18);

    blurIn("#g-sub", a[14], 0.2);
    blurIn("#g-ill", a[19], 0.2);

    // l05: start at one point, hop to whichever neighbour is closer

    const hopAt = [b[6], b[9], b[11], b[13]];
    const hopNums = gsap.utils.toArray("#g-hops span");
    hopAt.forEach((t, k) => {
      tl.to("#g-h" + (k + 1), { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.inOut" }, t);
      tl.to("#g-v" + (k + 1), { opacity: 1, duration: 0.2, ease: "power2.out" }, t + 0.3);
      if (k > 0) blurOut(hopNums[k - 1], t + 0.2, 0.1);
      blurIn(hopNums[k], t + 0.3, 0.15);
    });
    tl.fromTo("#g-hops", { scale: 1 }, { scale: 1.06, transformOrigin: "0% 50%", duration: 0.14, yoyo: true, repeat: 1, ease: "power1.out" }, b[16]);
    nodes.forEach((el, i) => { if (!route.includes(i)) tl.to(el, { opacity: 0.4, duration: 0.3, ease: "power2.out" }, b[17]); });
    tl.to(edges, { opacity: 0.45, duration: 0.3, ease: "power2.out" }, b[17]);
    blurIn("#g-skip", b[17] + 0.1, 0.2);

    blurIn("#g-bill", c[15] + 0.3, 0.2);
