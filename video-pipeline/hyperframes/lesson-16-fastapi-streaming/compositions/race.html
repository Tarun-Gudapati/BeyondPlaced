    blurIn("#r-track2", at("l02", 8), 0.2);
    tl.set("#r-ansB", { opacity: 1 }, at("l02", 9));
    tl.fromTo("#r-first", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at("l02", 9));
    blurIn(wordsB[0], at("l02", 10), 0.15);
    blurIn("#r-first-l", at("l02", 13), 0.2);
    const flowStart = at("l02", 10), flowEnd = at("l03", 16) + 0.1;
