<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 280' role='img' aria-label='HOW AN LLM PREDICTS THE NEXT TOKEN'>
  <rect width='720' height='280' fill='#0B0D18'/>
  <text x='24' y='28' fill='#9AA3C7' font-family='system-ui,sans-serif' font-size='12'>HOW AN LLM PREDICTS THE NEXT TOKEN</text>
  <rect x='40' y='90' width='140' height='70' rx='12' fill='#171A2B' stroke='#A08BFF'/>
  <text x='110' y='121' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Prompt</text>
  <text x='110' y='139' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>tokens in</text>
  <rect x='230' y='80' width='160' height='90' rx='12' fill='#171A2B' stroke='#FFC145'/>
  <text x='310' y='121' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>LLM</text>
  <text x='310' y='139' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>next-token probs</text>
  <rect x='440' y='90' width='140' height='70' rx='12' fill='#171A2B' stroke='#5FE3C0'/>
  <text x='510' y='121' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Next token</text>
  <text x='510' y='139' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>sample / argmax</text>
  <rect x='620' y='90' width='70' height='70' rx='12' fill='#171A2B' stroke='#5FE3C0'/>
  <text x='655' y='121' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>…</text>
  <text x='655' y='139' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>repeat</text>
  <text x='360' y='220' text-anchor='middle' fill='#9AA3C7' font-size='12' font-family='system-ui,sans-serif'>Context window holds prompt + generated tokens together</text>
</svg>
