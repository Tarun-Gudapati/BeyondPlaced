<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300' role='img' aria-label='AGENT THINK → ACT → OBSERVE LOOP'>
  <rect width='720' height='300' fill='#0B0D18'/>
  <text x='24' y='28' fill='#9AA3C7' font-family='system-ui,sans-serif' font-size='12'>AGENT THINK → ACT → OBSERVE LOOP</text>
  <rect x='280' y='30' width='160' height='55' rx='12' fill='#171A2B' stroke='#A08BFF'/>
  <text x='360' y='53.5' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Think</text>
  <text x='360' y='71.5' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>plan next step</text>
  <rect x='280' y='120' width='160' height='55' rx='12' fill='#171A2B' stroke='#FFC145'/>
  <text x='360' y='143.5' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Act</text>
  <text x='360' y='161.5' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>call tools</text>
  <rect x='280' y='210' width='160' height='55' rx='12' fill='#171A2B' stroke='#5FE3C0'/>
  <text x='360' y='233.5' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Observe</text>
  <text x='360' y='251.5' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>tool output</text>
  <rect x='500' y='120' width='160' height='55' rx='12' fill='#171A2B' stroke='#5FE3C0'/>
  <text x='580' y='143.5' text-anchor='middle' fill='#F5F3FF' font-size='13' font-family='system-ui,sans-serif' font-weight='600'>Stop</text>
  <text x='580' y='161.5' text-anchor='middle' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>final answer / cap</text>
  <text x='160' y='150' fill='#9AA3C7' font-size='11' font-family='system-ui,sans-serif'>loop</text>
</svg>
